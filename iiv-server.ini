; iiv-server の設定(UTF-8)。画面の「設定」で変えられる。
[server]
; 待ち受けるポート
port=5960
; 待ち受けるアドレス。空 = すべて、127.0.0.1 = この PC からだけ
listen=
; パスワード(そのものではなく、PBKDF2-SHA256 で導いた鍵。画面から設定する)
password=pbkdf2-sha256$100000$06ee6accffe415ea74e04de5e2c4df78$a15ff94346b02810e32e8f496bbfeeee27a356f6a04e9fe801b4ba84414474f1
; 見るだけのパスワード(空なら無し)
viewpassword=
; 1 = 誰にも操作させない(見るだけ)
viewonly=0
; 0 = すべての画面、n = ディスプレイ n だけ
display=0
; 1 = 接続・切断を通知で知らせる
notify=1
; 1 = Windows がカーソルを隠していても(マウスが無い PC など)、相手にカーソルを見せる
showcursor=1
; 1 = 接続されている間はスリープさせず、画面も消さない
nosleep=1
; 映像のビットレート(kbps)の上限。0 = 決めない(画質で決める。おすすめ)
kbps=0
; 動いている間の画質(1〜100)と、止まったら送り直す画質。止まってから送り直すまで(ms)
qmove=70
qstill=95
stillms=150
; 1 秒あたりの更新の上限。0 = 画面の書き換えの速さまで
maxfps=0

[general]
; system / light / dark
theme=system
; 1 = iiv-server.log に動作の記録を書く
log=0

[service]
; サービスとして登録する前の SoftwareSASGeneration(解除のときに戻す。-1 = 無かった、-2 = 控えていない)
sas_before=-2
